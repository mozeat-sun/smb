name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate traceability matrix
        run: bash tools/quality/generate_traceability_matrix.sh
      - name: Enforce traceability review gate
        run: bash tools/quality/traceability_gate.sh
      - name: Upload traceability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: traceability-artifacts
          path: artifacts/quality/

  protocol-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate protocol compatibility matrix
        run: bash tools/quality/protocol_compatibility_matrix.sh
      - name: Upload protocol compatibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protocol-compatibility-artifacts
          path: artifacts/quality/

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run static analysis
        run: bash tools/quality/static_analysis.sh
      - name: Upload static analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-artifacts
          path: artifacts/quality/

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Generate dependency inventory
        env:
          DEPENDENCY_SCAN_REQUIRE_SCANNER: "1"
          DEPENDENCY_SCAN_FAIL_ON_SEVERITY: "HIGH,CRITICAL"
        run: bash tools/quality/dependency_scan.sh
      - name: Upload dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-artifacts
          path: artifacts/quality/

  vulnerability-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate vulnerability remediation SLA report
        run: bash tools/quality/vulnerability_sla_report.sh
      - name: Upload vulnerability SLA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-sla-artifacts
          path: artifacts/quality/

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set reliability mode
        id: reliability-mode
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "duration=180" >> "$GITHUB_OUTPUT"
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "duration=30" >> "$GITHUB_OUTPUT"
            echo "mode=ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Run soak test
        env:
          RELIABILITY_MODE: ${{ steps.reliability-mode.outputs.mode }}
        run: bash tools/quality/soak_test.sh ${{ steps.reliability-mode.outputs.duration }}
      - name: Upload soak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soak-artifacts
          path: artifacts/quality/

  reliability-until-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run repeated reliability gate
        env:
          MAX_REPETITIONS: "20"
        run: bash tools/quality/reliability_until_fail.sh
      - name: Upload reliability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reliability-artifacts
          path: artifacts/quality/

  fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fault injection suite
        run: bash tools/quality/fault_injection.sh
      - name: Upload fault artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fault-artifacts
          path: artifacts/quality/

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fuzz gate
        run: bash tools/quality/fuzz_protocol.sh
      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/quality/

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run benchmark gate
        env:
          QUALITY_BASELINE_FILE: config/quality_baselines.ci.json
          QUALITY_BASELINE_PROFILE: ci
          QUALITY_REQUIRE_METRICS: "1"
        run: bash tools/quality/benchmark.sh
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: artifacts/quality/
