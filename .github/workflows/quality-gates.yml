name: Quality Gates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate traceability matrix
        run: bash tools/quality/generate_traceability_matrix.sh
      - name: Upload traceability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: traceability-artifacts
          path: artifacts/quality/

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run static analysis
        run: bash tools/quality/static_analysis.sh
      - name: Upload static analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-artifacts
          path: artifacts/quality/

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate dependency inventory
        run: bash tools/quality/dependency_scan.sh
      - name: Upload dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-artifacts
          path: artifacts/quality/

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run soak test
        run: bash tools/quality/soak_test.sh 30
      - name: Upload soak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soak-artifacts
          path: artifacts/quality/

  fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fault injection suite
        run: bash tools/quality/fault_injection.sh
      - name: Upload fault artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fault-artifacts
          path: artifacts/quality/

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fuzz gate
        run: bash tools/quality/fuzz_protocol.sh
      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/quality/

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run benchmark gate
        run: bash tools/quality/benchmark.sh
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: artifacts/quality/
